name: PR brief

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr: {description: Pull request number, required: true}
      post: {description: Comment on the PR, type: boolean, default: false}

concurrency:
  group: pr-brief-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

permissions: {contents: read, pull-requests: write}

jobs:
  brief:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/brief')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.issue.number || inputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/pull/${{ env.PR }}/head
      - uses: bkonold/pr-brief@e64e310bf1c7f03b386de358846868ca50c9a576
        with:
          copilot-token: ${{ secrets.COPILOT_PAT }}
          pr: ${{ env.PR }}
          post: ${{ github.event_name != 'workflow_dispatch' || inputs.post }}
